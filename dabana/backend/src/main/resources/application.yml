server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: dabana-backend

  datasource:
    url: jdbc:mysql://localhost:3306/dabana_order_restaurant?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&createDatabaseIfNotExist=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # This project does not yet have versioned SQL migrations.  Keep the
      # local MySQL schema in sync with the JPA entities so newly added admin
      # fields/tables do not make every repository query fail with HTTP 500.
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  jackson:
    time-zone: Asia/Ho_Chi_Minh
    date-format: yyyy-MM-dd'T'HH:mm:ss

  mail:
      host: smtp.gmail.com
      port: 587
      username: thanhnd@itss.vn
      password: "nivo vjlc biuy dbry"
      properties:
        mail:
          smtp:
            auth: true
            starttls:
              enable: true
            connectiontimeout: 5000
            timeout: 5000
            writetimeout: 5000
# JWT
app:
  jwt:
    secret: ${JWT_SECRET:dabana_super_secret_key_for_jwt_signing_change_in_production_2026}
    access-token-expiration-ms: 604800000      # 1 gio
    refresh-token-expiration-ms: 604800000   # 7 ngay

  # B01 BR03: giu ban tam thoi toi da 15 phut
  booking:
    hold-table-minutes: 15
    no-show-threshold-minutes: 15

  # B10 BR02: han phan hoi loi moi hang cho la 10 phut
  waitlist:
    invite-timeout-minutes: 10

  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000

logging:
  level:
      root: INFO
      com.dabana: DEBUG
      org.springframework.security: INFO
      org.hibernate.SQL: DEBUG
